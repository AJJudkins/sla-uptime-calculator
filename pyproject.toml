[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sla-uptime-calculator"
version = "0.2.0"
description = "Uptime percentage, allowed downtime and error-budget burn from an incident CSV."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sla-uptime = "sla:main"

[tool.setuptools]
py-modules = ["sla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
